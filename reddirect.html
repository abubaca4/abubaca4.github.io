<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор ссылок</title>
    <script>
        // Функция декодирования Base64URL
        function decodeBase64Url(b64url) {
            let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
            // Восстанавливаем паддинг, если нужно
            while (b64.length % 4) { b64 += '='; }
            const binString = atob(b64);
            const bytes = Uint8Array.from(binString, char => char.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        // Проверяем наличие хэша до отрисовки страницы, чтобы избежать мигания контента
        const hash = window.location.hash.substring(1);
        if (hash) {
            try {
                const decodedUrl = decodeBase64Url(hash);
                // Простейшая проверка, что это валидный URL, перед переходом
                new URL(decodedUrl); 
                // replace используется, чтобы промежуточная страница не сохранялась в истории кнопки "Назад"
                window.location.replace(decodedUrl); 
            } catch (e) {
                console.error('Ошибка декодирования или неверный URL.');
            }
        }
    </script>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1.5rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
        }
        input[readonly] {
            background-color: #f9fafb;
            color: #4b5563;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        .hidden-until-load {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container hidden-until-load" id="app">
        <h2>Маскировка ссылки</h2>
        
        <label for="inputUrl">Введите оригинальную ссылку:</label>
        <input type="url" id="inputUrl" placeholder="https://example.com" autocomplete="off" />

        <label for="outputUrl">Закодированная ссылка для шеринга:</label>
        <input type="text" id="outputUrl" readonly placeholder="Здесь появится результат..." />
        
        <button id="copyBtn">Скопировать ссылку</button>
    </div>

    <script>
        // Показываем интерфейс только если редирект не произошёл
        if (!window.location.hash || window.location.hash.length <= 1) {
            document.getElementById('app').style.display = 'block';
        }

        const inputUrl = document.getElementById('inputUrl');
        const outputUrl = document.getElementById('outputUrl');
        const copyBtn = document.getElementById('copyBtn');

        // Функция кодирования Base64URL
        function encodeBase64Url(text) {
            const bytes = new TextEncoder().encode(text);
            const binString = Array.from(bytes, byte => String.fromCharCode(byte)).join('');
            const b64 = btoa(binString);
            // Делаем строку безопасной для URL
            return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        // Обновление поля вывода при вводе текста
        inputUrl.addEventListener('input', () => {
            const val = inputUrl.value.trim();
            if (!val) {
                outputUrl.value = '';
                return;
            }
            try {
                const encoded = encodeBase64Url(val);
                // Формируем новую ссылку: текущий адрес страницы + # + закодированный текст
                const baseUrl = window.location.origin + window.location.pathname;
                outputUrl.value = `${baseUrl}#${encoded}`;
            } catch(e) {
                outputUrl.value = 'Ошибка кодирования';
            }
        });

        // Функция копирования в буфер обмена
        copyBtn.addEventListener('click', () => {
            if (outputUrl.value) {
                navigator.clipboard.writeText(outputUrl.value).then(() => {
                    const originalText = copyBtn.innerText;
                    copyBtn.innerText = 'Скопировано! ✔';
                    copyBtn.style.backgroundColor = '#10b981'; // Зеленый цвет успеха
                    setTimeout(() => {
                        copyBtn.innerText = originalText;
                        copyBtn.style.backgroundColor = ''; // Возвращаем оригинальный цвет
                    }, 2000);
                }).catch(() => {
                    alert('Не удалось скопировать. Пожалуйста, выделите и скопируйте вручную.');
                });
            }
        });
    </script>
</body>
</html>
